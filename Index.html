<style>
:root{--blue:#007aff;--red:#ff3b30;--glass:rgba(255,255,255,.18);--blur:blur(28px) saturate(1.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","IBM Plex Sans Thai",sans-serif;color:#fff;background:#1a1035;-webkit-font-smoothing:antialiased}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}

/* wallpaper — from CDCU logo colours */
.wall{position:fixed;inset:0;background:
 radial-gradient(ellipse 60% 45% at 10% 15%,#ff4d5e 0,transparent 70%),
 radial-gradient(ellipse 55% 50% at 95% 25%,#9b2f8f 0,transparent 70%),
 radial-gradient(ellipse 70% 50% at 30% 75%,#5a2a96 0,transparent 70%),
 radial-gradient(ellipse 50% 40% at 90% 90%,#2a3f9a 0,transparent 70%),
 linear-gradient(165deg,#5b1838,#2a1240 45%,#141a40)}
.wall::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12)}

.screen{position:relative;height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.status{display:flex;align-items:center;justify-content:space-between;padding:12px 28px 6px;font-weight:600;font-size:15.5px;min-height:46px}
.status .r{display:flex;align-items:center;gap:8px}
.status svg{width:18px;height:18px}
.glassbtn{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.glassbtn svg{width:16px;height:16px}
.edit-l,.edit-r{display:none;gap:8px}
body.jiggle .edit-l,body.jiggle .edit-r{display:flex}
body.jiggle .normal{display:none}

.pages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:12px 24px 24px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}

/* widgets */
.widgets{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:26px}
.widget{border-radius:24px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:16px 18px;min-height:158px;position:relative;overflow:hidden}
.w-clock{display:flex;gap:16px;align-items:center}
.w-clock img{width:92px;height:92px;border-radius:50%;background:#fff;padding:3px;flex:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.w-clock .day{font-size:13px;font-weight:600;color:#ff8a95;text-transform:uppercase;letter-spacing:.02em}
.w-clock .tm{font-size:44px;font-weight:300;line-height:1.05;letter-spacing:-.02em}
.w-clock .dt{font-size:13.5px;opacity:.85}
.w-clock .nm{font-size:13px;font-weight:600;margin-top:6px;opacity:.95}
.w-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:600}
.w-stat .k{font-size:12.5px;opacity:.9;text-align:center;line-height:1.3}
.w-label{text-align:center;font-size:12px;margin-top:6px;text-shadow:0 1px 3px rgba(0,0,0,.4)}

/* app grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:24px 8px;min-height:90px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#fff;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.iw{position:relative}
.icon{width:66px;height:66px;border-radius:23%;display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.22);transition:transform .15s,filter .15s}
.app.soon .icon{filter:grayscale(.55) brightness(.85)}
.app.soon .label::after{content:" · เร็วๆ นี้";opacity:.7}
.icon::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%)}
.icon svg{width:34px;height:34px;color:#fff;position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.app:active .icon{transform:scale(.9);filter:brightness(.8)}
.label{font-size:12px;line-height:1.25;text-align:center;max-width:88px;text-shadow:0 1px 3px rgba(0,0,0,.45);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:none;position:absolute;top:-6px;right:-6px;min-width:23px;height:23px;border-radius:12px;background:var(--red);font-size:14px;font-weight:600;display:grid;place-items:center;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.minus{display:none!important;display:none;position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:rgba(80,80,90,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:3;place-items:center}
.minus::before{content:"";width:11px;height:2.2px;background:#fff;border-radius:2px}
body.jiggle .minus{display:none!important;display:grid}
body.jiggle .badge{display:none}
body.jiggle .iw{animation:jig .28s ease-in-out infinite alternate}
body.jiggle .app:nth-child(2n) .iw{animation-delay:-.14s;animation-duration:.3s}
body.jiggle .app:nth-child(3n) .iw{animation-delay:-.07s}
@keyframes jig{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
.sortable-ghost{opacity:.3}
.sortable-chosen .iw{animation:none!important;transform:scale(1.12)}

/* bottom */
.bottom{padding:0 12px 12px}
.pill-row{display:flex;justify-content:center;margin:4px 0 12px}
.search-pill{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:999px;padding:6px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.search-pill svg{width:14px;height:14px}
.dots{display:flex;gap:9px;align-items:center;margin-left:14px}
.dots button{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots button.on{background:#fff}
.dock{background:rgba(255,255,255,.2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:34px;padding:14px 18px;display:flex;justify-content:space-around;gap:10px;min-height:94px;max-width:520px;margin:0 auto}
.dock .label{display:none}
.dock .minus{display:none!important;display:none!important}
.dock:empty::before{content:"แอปที่เปิดล่าสุดจะแสดงที่นี่";font-size:13px;opacity:.7;align-self:center}

/* App Library */
.lib-title{font-size:30px;font-weight:700;margin:4px 4px 16px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.cat{cursor:pointer;user-select:none}
.cat-box{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:26px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;aspect-ratio:1}
.cat-box .icon{width:100%;height:auto;aspect-ratio:1}
.cat-box .icon svg{width:52%;height:52%}
.cat .w-label{font-size:13px;font-weight:500}
.cat:active .cat-box{transform:scale(.96)}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;display:none;backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);background:rgba(20,10,35,.35)}
.ov.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.folder{flex-direction:column;align-items:center;justify-content:center;padding:20px}
.folder h2{font-size:30px;font-weight:700;margin:0 0 20px;text-align:center}
.folder .panel{background:rgba(255,255,255,.2);border-radius:38px;padding:26px 22px;width:min(420px,100%);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.folder .grid{grid-template-columns:repeat(3,1fr)}

.spot{flex-direction:column;align-items:center;padding:calc(20px + env(safe-area-inset-top)) 16px 20px}
.spot-bar{width:min(620px,100%);display:flex;gap:10px;align-items:center}
.spot-in{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.22);border-radius:12px;padding:0 12px}
.spot-in svg{width:18px;height:18px;opacity:.8}
.spot-in input{flex:1;background:none;border:none;outline:none;color:#fff;font:inherit;font-size:17px;padding:11px 0}
.spot-in input::placeholder{color:rgba(255,255,255,.65)}
.spot-bar>button{font-size:16px;font-weight:500}
.results{width:min(620px,100%);margin-top:18px;overflow-y:auto}
.results h4{margin:0 0 8px 6px;font-size:15px;font-weight:600}
.rlist{background:rgba(255,255,255,.18);border-radius:16px;overflow:hidden}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#fff;text-decoration:none;border-bottom:.5px solid rgba(255,255,255,.15)}
.rrow:last-child{border:none}
.rrow:hover,.rrow.sel{background:rgba(255,255,255,.12)}
.rrow .icon{width:40px;height:40px;border-radius:10px}
.rrow .icon svg{width:22px;height:22px}
.rrow .t{font-size:15.5px;font-weight:500}
.rrow .s{font-size:12.5px;opacity:.7}
.noresult{text-align:center;opacity:.7;margin-top:40px}

/* iOS sheet (light / dark) */
.sheet-ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-ov.show{opacity:1;pointer-events:auto}
.sheet{--bg:#f2f2f7;--cell:#fff;--tx:#000;--sub:#8a8a8e;--sep:#c6c6c8;background:var(--bg);color:var(--tx);width:100%;max-width:560px;border-radius:14px 14px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.sheet-ov.show .sheet{transform:none}
@media(prefers-color-scheme:dark){.sheet{--bg:#1c1c1e;--cell:#2c2c2e;--tx:#fff;--sub:#8d8d93;--sep:#3d3d41}}
@media(min-width:700px){.sheet-ov{align-items:center}.sheet{border-radius:14px}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:2}
.nav b{font-size:17px}
.nav button{color:var(--blue);font-size:17px}
.nav button:last-child{justify-self:end;font-weight:600}
.nav button:disabled{color:var(--sub)}
.preview{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 22px}
.preview .icon{width:84px;height:84px}
.preview .icon svg{width:44px;height:44px}
.sec-h{font-size:13px;color:var(--sub);text-transform:uppercase;margin:0 32px 7px}
.group{background:var(--cell);border-radius:10px;margin:0 16px 24px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:46px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row label{width:96px;flex:none;font-size:16px}
.row input[type=text],.row input:not([type]),.row textarea{flex:1;border:none;outline:none;background:none;color:var(--tx);font:inherit;font-size:16px;padding:12px 0;min-width:0}
.row input::placeholder{color:var(--sub)}
.row.btnrow{justify-content:center;color:var(--blue);font-size:16px;cursor:pointer}
.row.btnrow.red{color:var(--red)}
.foot{font-size:13px;color:var(--sub);margin:-16px 32px 24px}
.switch{margin-left:auto;appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:#e9e9eb;position:relative;cursor:pointer;transition:.2s;flex:none}
@media(prefers-color-scheme:dark){.switch{background:#39393d}}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.switch:checked{background:#34c759}
.switch:checked::after{left:22px}
.ipick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;padding:14px}
.ipick button{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;color:var(--tx);background:var(--bg)}
.ipick button svg{width:22px;height:22px}
.ipick button.on{background:var(--blue);color:#fff}
.cpick{display:flex;flex-wrap:wrap;gap:12px;padding:14px 16px}
.cpick button{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px var(--cell),0 0 0 2px var(--cell)}
.cpick button.on{box-shadow:0 0 0 3px var(--cell),0 0 0 5px var(--sub)}
.sheet textarea{min-height:200px;font-family:ui-monospace,monospace;font-size:12px;padding:12px 0}

/* iOS alert */
.alert-ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
.alert-ov.show{display:flex;animation:fade .15s}
.alert{width:270px;border-radius:14px;background:rgba(242,242,247,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#000;text-align:center;overflow:hidden;animation:pop .2s}
@media(prefers-color-scheme:dark){.alert{background:rgba(44,44,46,.9);color:#fff}}
.alert .b{padding:18px 16px 16px}
.alert h3{margin:0 0 4px;font-size:17px}
.alert p{margin:0;font-size:13px}
.alert .acts{display:flex;border-top:.5px solid rgba(60,60,67,.36)}
.alert .acts button{flex:1;padding:11px;font-size:17px;color:var(--blue)}
.alert .acts button+button{border-left:.5px solid rgba(60,60,67,.36)}
.alert .acts .red{color:var(--red);font-weight:600}

/* banner */
.banner{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-150%);z-index:70;background:rgba(30,30,35,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:10px 18px;font-size:14.5px;display:flex;gap:10px;align-items:center;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:92vw}
.banner img{width:24px;height:24px;border-radius:6px;background:#fff}
.banner.show{transform:translate(-50%,0)}

@media(max-width:560px){
  .status{padding:10px 22px 4px}
  .page{padding:8px 18px 20px}
  .grid{grid-template-columns:repeat(4,1fr);gap:20px 4px}
  .icon{width:60px;height:60px}
  .icon svg{width:31px;height:31px}
  .label{font-size:11.5px;max-width:76px}
  .widgets{grid-template-columns:1fr 1fr;gap:14px}
  .widgets>div:first-child{grid-column:1/-1}
  .widgets>div:last-child{display:none}
  .w-clock img{width:70px;height:70px}
  .w-clock .tm{font-size:38px}
  .widget{min-height:0}
  .lib{grid-template-columns:1fr 1fr;gap:16px}
  .dock{padding:12px 14px;min-height:86px}
}
</style>
</head>

/* CSV → apps */
function parseCSV(t){const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
function toApps(rows){
  const h=rows.shift().map(x=>x.trim());const col=n=>h.indexOf(n);
  const ci={name:col('ชื่อ'),url:col('ลิงก์'),desc:col('คำอธิบาย'),cat:col('หมวดหมู่'),icon:col('ไอคอน'),color:col('สี'),show:col('แสดง')};
  return rows.map(r=>{const g=k=>ci[k]>=0?(r[ci[k]]||'').trim():'';
    let url=g('url');if(url&&!/^[a-z]+:\/\//i.test(url))url='http://'+url;
    const ic=g('icon'),co=g('color');
    return {id:g('name'),name:g('name'),url,desc:g('desc'),cat:g('cat')||'อื่น ๆ',icon:TH_ICON[ic]||(P[ic]?ic:'link'),color:TH_COLOR[co]||(C[co]?co:'blue'),hide:g('show')==='ซ่อน'}
  }).filter(x=>x.name&&!x.hide)}
async function sync(manual){
  try{
    const r=await fetch(DATA_URL+'&_='+Date.now());if(!r.ok)throw 0;
    const apps=toApps(parseCSV(await r.text()));if(!apps.length)throw 0;
    items=apps;try{localStorage.setItem(CACHE,JSON.stringify(apps))}catch(e){}
    render();if(manual)banner('อัปเดตรายการแล้ว');
  }catch(e){if(manual)banner('โหลดรายการไม่สำเร็จ — แสดงข้อมูลล่าสุดที่เคยโหลด')}
}

function banner(m){const b=$('#banner');$('#bTxt').textContent=m;b.classList.add('show');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),2400)}
const byId=id=>items.find(x=>x.id===id);
const cats=()=>[...new Set(items.map(i=>i.cat))];
function appHTML(it){const has=!!it.url;
  return `<a class="app ${has?'':'soon'}" data-id="${esc(it.id)}" ${has?`href="${esc(it.url)}" target="_blank" rel="noopener"`:'href="#"'} title="${esc(it.desc||it.name)}">
    <div class="iw"><div class="icon" style="${bg(it.color)}">${ico(it.icon)}</div></div>
    <div class="label">${esc(it.name)}</div></a>`}
function renderDock(){$('#dock').innerHTML=recent.map(byId).filter(x=>x&&x.url).slice(0,4).map(appHTML).join('')}
function render(){
  $('#grid').innerHTML=items.map(appHTML).join('');renderDock();
  $('#lib').innerHTML=cats().map(c=>{const l=items.filter(x=>x.cat===c);
    return `<div class="cat" data-c="${esc(c)}"><div class="cat-box">${l.slice(0,4).map(x=>`<div class="icon" style="${bg(x.color)}">${ico(x.icon)}</div>`).join('')}</div><div class="w-label">${esc(c)}</div></div>`}).join('');
  const ok=items.filter(x=>x.url).length,pct=items.length?Math.round(ok/items.length*100):0;
  $('#ringArc').setAttribute('stroke-dasharray',`${pct} 100`);$('#ringTxt').textContent=`${ok}/${items.length}`;
}
document.addEventListener('click',e=>{
  const a=e.target.closest('.app');if(!a)return;const it=byId(a.dataset.id);if(!it)return;
  if(!it.url){e.preventDefault();banner(`"${it.name}" ยังไม่เปิดให้ใช้งาน`);return}
  recent=[it.id,...recent.filter(x=>x!==it.id)].slice(0,8);try{localStorage.setItem(RKEY,JSON.stringify(recent))}catch(e){}
  setTimeout(renderDock,300);closeOverlays();
});
$('#refreshBtn').onclick=()=>sync(true);
/* เจ้าของ: เปิดลิงก์ต่อท้าย #admin เพื่อแสดงปุ่ม "แก้ไข" ไปยัง Google Sheet */
if(location.hash==='#admin'){const a=$('#adminBtn');a.href=EDIT_URL;a.style.display='inline-flex'}

/* pages + dots */
const pages=$('#pages');
pages.addEventListener('scroll',()=>{const p=Math.round(pages.scrollLeft/pages.clientWidth);document.querySelectorAll('#dots button').forEach((b,i)=>b.classList.toggle('on',i===p))},{passive:true});
$('#dots').onclick=e=>{const b=e.target.closest('button');if(b)pages.scrollTo({left:pages.clientWidth*b.dataset.p})};
/* folders */
$('#lib').onclick=e=>{const c=e.target.closest('.cat');if(!c)return;
  $('#fTitle').textContent=c.dataset.c;$('#fGrid').innerHTML=items.filter(x=>x.cat===c.dataset.c).map(appHTML).join('');$('#folder').classList.add('show')};
$('#folder').onclick=e=>{if(!e.target.closest('.app'))$('#folder').classList.remove('show')};
/* spotlight */
let sel=0;
function openSpot(){$('#spot').classList.add('show');$('#q').value='';renderSpot();setTimeout(()=>$('#q').focus(),30)}
function renderSpot(){const q=$('#q').value.trim().toLowerCase();
  const list=items.filter(x=>!q||(x.name+' '+x.desc+' '+x.cat).toLowerCase().includes(q));
  sel=Math.min(sel,Math.max(list.length-1,0));
  $('#results').innerHTML=list.length?`<h4>${q?'ผลการค้นหา':'แอปทั้งหมด'}</h4><div class="rlist">`+list.map((x,i)=>`<a class="rrow app ${i===sel&&q?'sel':''}" data-id="${esc(x.id)}" ${x.url?`href="${esc(x.url)}" target="_blank" rel="noopener"`:'href="#"'}><div class="icon" style="${bg(x.color)}">${ico(x.icon)}</div><div><div class="t">${esc(x.name)}</div><div class="s">${esc(x.desc||x.cat)}${x.url?'':' · เร็วๆ นี้'}</div></div></a>`).join('')+'</div>':'<div class="noresult">ไม่พบ "'+esc(q)+'"</div>'}
$('#q').oninput=()=>{sel=0;renderSpot()};
$('#q').onkeydown=e=>{const rows=[...document.querySelectorAll('#results .rrow')];
  if(e.key==='ArrowDown'){sel=Math.min(sel+1,rows.length-1);renderSpot();e.preventDefault()}
  if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);renderSpot();e.preventDefault()}
  if(e.key==='Enter'&&rows[sel])rows[sel].click()};
$('#searchBtn').onclick=openSpot;$('#spotCancel').onclick=()=>$('#spot').classList.remove('show');
$('#spot').onclick=e=>{if(e.target.id==='spot')$('#spot').classList.remove('show')};
function closeOverlays(){document.querySelectorAll('.ov.show').forEach(o=>o.classList.remove('show'))}
document.addEventListener('keydown',e=>{const t=document.activeElement.tagName;
  if((e.key==='/'||(e.key==='k'&&(e.metaKey||e.ctrlKey)))&&t!=='INPUT'){e.preventDefault();openSpot()}
  if(e.key==='Escape')closeOverlays()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
/* clock */
function tick(){const d=new Date(),t=d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  $('#sbTime').textContent=t;$('#wTime').textContent=t;
  $('#wDay').textContent=d.toLocaleDateString('th-TH',{weekday:'long'});
  $('#wDate').textContent=d.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})}
render();sync();tick();setInterval(tick,10000);
</script>
</body>
</html>
